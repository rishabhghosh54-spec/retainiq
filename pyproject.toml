[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retainiq"
version = "0.2.0"
description = "Point-in-time subscription churn research and serving MVP"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "pyarrow>=19", "duckdb>=1.2,<3", "fastapi>=0.115,<1", "uvicorn>=0.34", "streamlit>=1.42,<2", "joblib>=1.4", "pydantic>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]
data = ["kaggle>=1.7", "py7zr>=0.22"]

[project.scripts]
retainiq = "retainiq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
